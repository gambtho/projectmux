<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">ProjectMux — declarative tmux workspaces</title>
  <desc id="desc">A YAML workspace definition flows through ProjectMux into a tmux session whose windows run on the host or in a Dev Container.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="52%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#0d2230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122238"/>
      <stop offset="100%" stop-color="#0d1b2d"/>
    </linearGradient>
    <linearGradient id="terminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1a2b"/>
      <stop offset="100%" stop-color="#0a1524"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#9fb8d1" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" rx="0" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1055" cy="78" r="128" fill="#0ea5e9" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="172" cy="588" r="108" fill="#2dd4bf" fill-opacity="0.07" filter="url(#glow)"/>

  <!-- Brand mark -->
  <g transform="translate(70 52)">
    <path d="M0 12 H22 C32 12 35 23 44 23 H66" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 29 H22 C32 29 35 23 44 23 H66" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 46 H22 C32 46 35 23 44 23 H66" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
    <rect x="66" y="4" width="46" height="38" rx="9" fill="#10283a" stroke="#67e8f9" stroke-opacity="0.75"/>
    <path d="M79 16 L88 23 L79 30" fill="none" stroke="#e6f7ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M92 31 H101" stroke="#5eead4" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <text x="204" y="91" class="sans" font-size="54" font-weight="760" letter-spacing="-1.7" fill="#f8fbff">ProjectMux</text>
  <text x="72" y="132" class="sans" font-size="24" font-weight="520" fill="#c2d2e3">Declarative tmux workspaces for Linux and WSL</text>
  <text x="72" y="163" class="sans" font-size="17" fill="#8fa8c0">Define the workspace once. Run each window on the host or in a Dev Container.</text>

  <!-- YAML card -->
  <g filter="url(#shadow)">
    <rect x="72" y="204" width="380" height="342" rx="22" fill="url(#card)" stroke="#7dd3fc" stroke-opacity="0.24"/>
    <rect x="72" y="204" width="380" height="50" rx="22" fill="#162a43"/>
    <path d="M72 232 H452" stroke="#8ab2cf" stroke-opacity="0.16"/>
    <circle cx="98" cy="229" r="6" fill="#fb7185"/>
    <circle cx="118" cy="229" r="6" fill="#fbbf24"/>
    <circle cx="138" cy="229" r="6" fill="#34d399"/>
    <text x="164" y="236" class="mono" font-size="15" font-weight="700" fill="#d7e7f5">workspace.yaml</text>

    <text x="100" y="287" class="mono" font-size="16" fill="#93c5fd">version:</text>
    <text x="184" y="287" class="mono" font-size="16" fill="#fcd34d">1</text>

    <text x="100" y="321" class="mono" font-size="16" fill="#93c5fd">devcontainer:</text>
    <text x="122" y="349" class="mono" font-size="16" fill="#93c5fd">enabled:</text>
    <text x="216" y="349" class="mono" font-size="16" fill="#5eead4">auto</text>

    <text x="100" y="387" class="mono" font-size="16" fill="#93c5fd">windows:</text>
    <text x="122" y="417" class="mono" font-size="16" fill="#a7f3d0">- name:</text>
    <text x="216" y="417" class="mono" font-size="16" fill="#f8fafc">agent</text>
    <text x="144" y="445" class="mono" font-size="16" fill="#93c5fd">agent:</text>
    <text x="216" y="445" class="mono" font-size="16" fill="#f8fafc">claude</text>
    <text x="144" y="473" class="mono" font-size="16" fill="#93c5fd">location:</text>
    <text x="246" y="473" class="mono" font-size="16" fill="#5eead4">container</text>

    <text x="122" y="511" class="mono" font-size="16" fill="#a7f3d0">- name:</text>
    <text x="216" y="511" class="mono" font-size="16" fill="#f8fafc">shell</text>
    <text x="144" y="539" class="mono" font-size="16" fill="#93c5fd">location:</text>
    <text x="246" y="539" class="mono" font-size="16" fill="#fbbf24">host</text>
  </g>

  <!-- Flow -->
  <g>
    <path d="M472 312 H526" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M472 432 H526" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M514 304 L526 312 L514 320" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M514 424 L526 432 L514 440" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="526" y="315" width="208" height="112" rx="24" fill="#10283a" stroke="#5eead4" stroke-opacity="0.65" filter="url(#shadow)"/>
    <rect x="548" y="337" width="164" height="42" rx="12" fill="#071722" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="630" y="364" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#e6fbff">$ projectmux open</text>
    <text x="630" y="402" text-anchor="middle" class="sans" font-size="14" font-weight="650" fill="#9bb4ca">observe → plan → reconcile</text>

    <path d="M734 371 H788" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <path d="M776 363 L788 371 L776 379" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- tmux card -->
  <g filter="url(#shadow)">
    <rect x="788" y="204" width="420" height="342" rx="22" fill="url(#terminal)" stroke="#5eead4" stroke-opacity="0.28"/>
    <rect x="788" y="204" width="420" height="50" rx="22" fill="#12283a"/>
    <path d="M788 254 H1208" stroke="#8ab2cf" stroke-opacity="0.16"/>
    <circle cx="814" cy="229" r="6" fill="#fb7185"/>
    <circle cx="834" cy="229" r="6" fill="#fbbf24"/>
    <circle cx="854" cy="229" r="6" fill="#34d399"/>
    <text x="880" y="236" class="mono" font-size="15" font-weight="700" fill="#d7e7f5">tmux · my-project</text>

    <rect x="812" y="278" width="372" height="72" rx="14" fill="#112237" stroke="#5eead4" stroke-opacity="0.20"/>
    <circle cx="838" cy="314" r="6" fill="#34d399"/>
    <text x="858" y="309" class="mono" font-size="16" font-weight="700" fill="#f8fafc">0: agent</text>
    <text x="858" y="331" class="mono" font-size="13" fill="#9fb5c9">claude</text>
    <rect x="1022" y="296" width="142" height="31" rx="15.5" fill="#0d3d42" stroke="#5eead4" stroke-opacity="0.45"/>
    <text x="1093" y="316" text-anchor="middle" class="sans" font-size="11" font-weight="800" letter-spacing="0.8" fill="#99f6e4">DEV CONTAINER</text>

    <rect x="812" y="365" width="372" height="72" rx="14" fill="#112237" stroke="#fbbf24" stroke-opacity="0.18"/>
    <circle cx="838" cy="401" r="6" fill="#34d399"/>
    <text x="858" y="396" class="mono" font-size="16" font-weight="700" fill="#f8fafc">1: shell</text>
    <text x="858" y="418" class="mono" font-size="13" fill="#9fb5c9">zsh</text>
    <rect x="1090" y="383" width="74" height="31" rx="15.5" fill="#3a2f16" stroke="#fbbf24" stroke-opacity="0.42"/>
    <text x="1127" y="403" text-anchor="middle" class="sans" font-size="11" font-weight="800" letter-spacing="0.8" fill="#fde68a">HOST</text>

    <rect x="812" y="452" width="372" height="72" rx="14" fill="#112237" stroke="#38bdf8" stroke-opacity="0.18"/>
    <circle cx="838" cy="488" r="6" fill="#34d399"/>
    <text x="858" y="483" class="mono" font-size="16" font-weight="700" fill="#f8fafc">2: tests</text>
    <text x="858" y="505" class="mono" font-size="13" fill="#9fb5c9">go test ./...</text>
    <rect x="1022" y="470" width="142" height="31" rx="15.5" fill="#0d3d42" stroke="#5eead4" stroke-opacity="0.45"/>
    <text x="1093" y="490" text-anchor="middle" class="sans" font-size="11" font-weight="800" letter-spacing="0.8" fill="#99f6e4">DEV CONTAINER</text>
  </g>

  <text x="640" y="602" text-anchor="middle" class="sans" font-size="17" font-weight="650" fill="#b4c8da">
    One YAML workspace · any worktree · host or container
  </text>
</svg>
