name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Linux and WSL are the v1 platforms, so Linux is the only build target.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum the module declares, so CI verifies the version go.mod
        # promises, plus the current stable release to catch drift early.
        go: ["1.25.x", "stable"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build ./cmd/projectmux
